name: Legacy visual review (manual)
on:
  # Historical three-viewport suite; run explicitly when reviewing its scenes.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile-390, mobile-430]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual -- --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: story-review-${{ matrix.project }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14
