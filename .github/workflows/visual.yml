name: Visual review
on:
  pull_request:
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'tests/visual/**', 'playwright.config.ts', 'package*.json', '.github/workflows/visual.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: story-desktop-mobile-review
          path: |
            test-results/
            playwright-report/
          retention-days: 14
